<svg width="860" height="410" xmlns="http://www.w3.org/2000/svg" font-family="'Segoe UI',Arial,sans-serif">
  <defs>
    <pattern id="hatch" width="7" height="7" patternTransform="rotate(45)" patternUnits="userSpaceOnUse">
      <rect width="7" height="7" fill="#e8f0fe"/>
      <line x1="0" y1="0" x2="0" y2="7" stroke="#1a73e8" stroke-width="3"/>
    </pattern>
  </defs>

  <rect width="860" height="410" fill="#ffffff" rx="12" stroke="#e8eaed" stroke-width="1"/>

  <!-- Title -->
  <text x="430" y="30" text-anchor="middle" font-size="16" font-weight="bold" fill="#202124">Operations Benchmark — Traditional NOC vs AIOps Agent</text>

  <!-- Legend -->
  <rect x="240" y="44" width="14" height="14" fill="#9aa0a6" rx="2"/>
  <text x="260" y="56" font-size="12" fill="#3c4043">Traditional NOC</text>
  <rect x="400" y="44" width="14" height="14" fill="url(#hatch)" stroke="#1a73e8" stroke-width="1" rx="2"/>
  <text x="420" y="56" font-size="12" fill="#3c4043">AIOps Agent</text>

  <!-- Section header labels -->
  <text x="270" y="74" text-anchor="middle" font-size="10" fill="#80868b" letter-spacing="0.5">RESPONSE TIME  (minutes · lower is better)</text>
  <text x="640" y="74" text-anchor="middle" font-size="10" fill="#80868b" letter-spacing="0.5">EFFICIENCY METRICS  (% · lower is better except Audit)</text>

  <!-- Section divider -->
  <line x1="458" y1="78" x2="458" y2="358" stroke="#e0e0e0" stroke-width="1.5" stroke-dasharray="5,4"/>

  <!-- ============================================================ -->
  <!-- LEFT SECTION: Time metrics                                    -->
  <!-- Chart area: x=90..448, y=80..335  (358w x 255h)             -->
  <!-- Y max=40 min, scale=255/40=6.375 px/min                      -->
  <!-- y(v) = 335 - v*6.375                                         -->
  <!-- Bars: w=48, gap=8, group_w=104, between=14                   -->
  <!-- G1 trad=100, aiops=156; G2 trad=218, aiops=274; G3 trad=336, aiops=392 -->
  <!-- ============================================================ -->

  <line x1="90" y1="80" x2="90" y2="335" stroke="#dadce0" stroke-width="1.5"/>
  <line x1="90" y1="335" x2="450" y2="335" stroke="#dadce0" stroke-width="1.5"/>

  <!-- Gridlines left (10, 20, 30, 40 min) -->
  <!-- 10 → y=335-63.75=271; 20 → 208; 30 → 144; 40 → 80 -->
  <line x1="90" y1="271" x2="450" y2="271" stroke="#f1f3f4" stroke-width="1"/>
  <text x="82" y="275" text-anchor="end" font-size="10" fill="#9aa0a6">10</text>
  <line x1="90" y1="208" x2="450" y2="208" stroke="#f1f3f4" stroke-width="1"/>
  <text x="82" y="212" text-anchor="end" font-size="10" fill="#9aa0a6">20</text>
  <line x1="90" y1="144" x2="450" y2="144" stroke="#f1f3f4" stroke-width="1"/>
  <text x="82" y="148" text-anchor="end" font-size="10" fill="#9aa0a6">30</text>
  <line x1="90" y1="80" x2="450" y2="80" stroke="#f1f3f4" stroke-width="1"/>
  <text x="82" y="84" text-anchor="end" font-size="10" fill="#9aa0a6">40</text>
  <text x="40" y="210" text-anchor="middle" font-size="10" fill="#9aa0a6" transform="rotate(-90,40,210)">Minutes</text>

  <!-- G1: Config Fault MTTR  (trad=18, aiops=2) -->
  <!-- trad: h=18*6.375=114.75≈115, y=335-115=220 -->
  <rect x="100" y="220" width="48" height="115" fill="#9aa0a6" rx="3 3 0 0"/>
  <text x="124" y="213" text-anchor="middle" font-size="12" font-weight="bold" fill="#5f6368">18</text>
  <!-- aiops: h=2*6.375=12.75≈13, y=322 -->
  <rect x="156" y="322" width="48" height="13" fill="url(#hatch)" stroke="#1a73e8" stroke-width="1" rx="3 3 0 0"/>
  <text x="180" y="315" text-anchor="middle" font-size="12" font-weight="bold" fill="#1a73e8">2</text>
  <text x="152" y="353" text-anchor="middle" font-size="11" fill="#3c4043">Config Fault</text>
  <text x="152" y="368" text-anchor="middle" font-size="10" fill="#9aa0a6">MTTR</text>

  <!-- G2: Connectivity MTTR  (trad=35, aiops=12) -->
  <!-- trad: h=35*6.375=223, y=335-223=112 -->
  <rect x="218" y="112" width="48" height="223" fill="#9aa0a6" rx="3 3 0 0"/>
  <text x="242" y="105" text-anchor="middle" font-size="12" font-weight="bold" fill="#5f6368">35</text>
  <!-- aiops: h=12*6.375=76.5≈77, y=258 -->
  <rect x="274" y="258" width="48" height="77" fill="url(#hatch)" stroke="#1a73e8" stroke-width="1" rx="3 3 0 0"/>
  <text x="298" y="251" text-anchor="middle" font-size="12" font-weight="bold" fill="#1a73e8">12</text>
  <text x="270" y="353" text-anchor="middle" font-size="11" fill="#3c4043">Connectivity</text>
  <text x="270" y="368" text-anchor="middle" font-size="10" fill="#9aa0a6">Fault MTTR</text>

  <!-- G3: Alert-to-Diagnosis  (trad=12, aiops=<1) -->
  <!-- trad: h=12*6.375=76.5≈77, y=258 -->
  <rect x="336" y="258" width="48" height="77" fill="#9aa0a6" rx="3 3 0 0"/>
  <text x="360" y="251" text-anchor="middle" font-size="12" font-weight="bold" fill="#5f6368">12</text>
  <!-- aiops: h~3px (min visible), y=332 -->
  <rect x="392" y="330" width="48" height="5" fill="url(#hatch)" stroke="#1a73e8" stroke-width="1" rx="2 2 0 0"/>
  <text x="416" y="323" text-anchor="middle" font-size="12" font-weight="bold" fill="#1a73e8">&lt;1</text>
  <text x="388" y="353" text-anchor="middle" font-size="11" fill="#3c4043">Alert-to-</text>
  <text x="388" y="368" text-anchor="middle" font-size="10" fill="#9aa0a6">Diagnosis</text>

  <!-- ============================================================ -->
  <!-- RIGHT SECTION: Efficiency metrics                            -->
  <!-- Chart area: x=468..840, y=80..335  (372w x 255h)            -->
  <!-- Y max=100%, scale=255/100=2.55 px/%                          -->
  <!-- y(v) = 335 - v*2.55                                          -->
  <!-- Bars: w=48, gap=8, group_w=104, between=20                   -->
  <!-- G4 trad=476, aiops=532; G5 trad=608, aiops=664; G6 trad=740, aiops=796 -->
  <!-- ============================================================ -->

  <line x1="468" y1="80" x2="468" y2="335" stroke="#dadce0" stroke-width="1.5"/>
  <line x1="468" y1="335" x2="848" y2="335" stroke="#dadce0" stroke-width="1.5"/>

  <!-- Gridlines right (20, 40, 60, 80, 100%) -->
  <!-- 20 → y=335-51=284; 40 → 233; 60 → 182; 80 → 131; 100 → 80 -->
  <line x1="468" y1="284" x2="848" y2="284" stroke="#f1f3f4" stroke-width="1"/>
  <text x="462" y="288" text-anchor="end" font-size="10" fill="#9aa0a6">20</text>
  <line x1="468" y1="233" x2="848" y2="233" stroke="#f1f3f4" stroke-width="1"/>
  <text x="462" y="237" text-anchor="end" font-size="10" fill="#9aa0a6">40</text>
  <line x1="468" y1="182" x2="848" y2="182" stroke="#f1f3f4" stroke-width="1"/>
  <text x="462" y="186" text-anchor="end" font-size="10" fill="#9aa0a6">60</text>
  <line x1="468" y1="131" x2="848" y2="131" stroke="#f1f3f4" stroke-width="1"/>
  <text x="462" y="135" text-anchor="end" font-size="10" fill="#9aa0a6">80</text>
  <line x1="468" y1="80" x2="848" y2="80" stroke="#f1f3f4" stroke-width="1"/>
  <text x="462" y="84" text-anchor="end" font-size="10" fill="#9aa0a6">100</text>
  <text x="855" y="210" text-anchor="middle" font-size="10" fill="#9aa0a6" transform="rotate(90,855,210)">Percent</text>

  <!-- G4: False Positive Rate  (trad=40%, aiops=8%) -->
  <!-- trad: h=40*2.55=102, y=233 -->
  <rect x="476" y="233" width="48" height="102" fill="#9aa0a6" rx="3 3 0 0"/>
  <text x="500" y="226" text-anchor="middle" font-size="12" font-weight="bold" fill="#5f6368">40%</text>
  <!-- aiops: h=8*2.55=20.4≈20, y=315 -->
  <rect x="532" y="315" width="48" height="20" fill="url(#hatch)" stroke="#1a73e8" stroke-width="1" rx="3 3 0 0"/>
  <text x="556" y="308" text-anchor="middle" font-size="12" font-weight="bold" fill="#1a73e8">8%</text>
  <text x="528" y="353" text-anchor="middle" font-size="11" fill="#3c4043">False Positive</text>
  <text x="528" y="368" text-anchor="middle" font-size="10" fill="#9aa0a6">Escalation Rate</text>

  <!-- G5: Alerts Needing Human  (trad=100%, aiops=40%) -->
  <!-- trad: h=100*2.55=255, y=80 -->
  <rect x="608" y="80" width="48" height="255" fill="#9aa0a6" rx="3 3 0 0"/>
  <text x="632" y="73" text-anchor="middle" font-size="12" font-weight="bold" fill="#5f6368">100%</text>
  <!-- aiops: h=40*2.55=102, y=233 -->
  <rect x="664" y="233" width="48" height="102" fill="url(#hatch)" stroke="#1a73e8" stroke-width="1" rx="3 3 0 0"/>
  <text x="688" y="226" text-anchor="middle" font-size="12" font-weight="bold" fill="#1a73e8">40%</text>
  <text x="660" y="353" text-anchor="middle" font-size="11" fill="#3c4043">Alerts Needing</text>
  <text x="660" y="368" text-anchor="middle" font-size="10" fill="#9aa0a6">Human Action</text>

  <!-- G6: Audit Trail Coverage  (trad=30%, aiops=100%)  ↑ higher is better -->
  <!-- trad: h=30*2.55=76.5≈77, y=258 -->
  <rect x="740" y="258" width="48" height="77" fill="#9aa0a6" rx="3 3 0 0"/>
  <text x="764" y="251" text-anchor="middle" font-size="12" font-weight="bold" fill="#5f6368">30%</text>
  <!-- aiops: h=100*2.55=255, y=80 -->
  <rect x="796" y="80" width="48" height="255" fill="url(#hatch)" stroke="#1a73e8" stroke-width="1" rx="3 3 0 0"/>
  <text x="820" y="73" text-anchor="middle" font-size="12" font-weight="bold" fill="#1a73e8">100%</text>
  <text x="792" y="353" text-anchor="middle" font-size="11" fill="#3c4043">Audit Trail</text>
  <text x="792" y="368" text-anchor="middle" font-size="10" fill="#9aa0a6">Coverage (↑ better)</text>

</svg>
