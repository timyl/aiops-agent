apiVersion: v1
kind: ConfigMap
metadata:
  name: aiops-config
  namespace: aiops
data:
  # External services (outside K8s)
  ES_URL:           "http://172.16.100.91:30200"
  ES_USER:          "elastic"
  PROMETHEUS_URL:   "http://172.16.100.91:30504"
  PCF_CONFIG_URL:   "http://172.16.100.231:8000"

  # Kafka + Redis — internal K8s service names (same namespace)
