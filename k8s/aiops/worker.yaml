apiVersion: apps/v1
kind: Deployment
metadata:
  name: aiops-worker
  namespace: aiops
  labels:
    app: aiops-worker
spec:
  replicas: 1
  selector:
    matchLabels:
      app: aiops-worker
  template:
    metadata:
      labels:
        app: aiops-worker
    spec:
      containers:
        - name: worker
          image: 172.16.100.100:5000/aiops-agent:latest
          imagePullPolicy: Always
          command:
            - python
            - -m
            - agent.worker
          envFrom:
            - configMapRef:
                name: aiops-config
            - secretRef:
                name: aiops-secret
          ports:
            - containerPort: 9100
              name: metrics
          volumeMounts:
            - name: incident-data
              mountPath: /data
            - name: agent-config
              mountPath: /app/config
          resources:
            requests:
              cpu: "200m"
              memory: "256Mi"
            limits:
              cpu: "1000m"
              memory: "1Gi"
      volumes:
        - name: incident-data
          emptyDir: {}
        - name: agent-config
          configMap:
            name: aiops-agent-config
