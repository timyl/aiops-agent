apiVersion: v1
data:
  alertspcf: |
    groups:
    - name: PCF_ALERTS
      rules:

      - alert: PCF_SERVICES_DOWN
        expr: sum by(service, namespace, category)(appinfo_service_running{application="occnp",service!~".*altsvc-cache",vendor="Oracle"}) < 1
        labels:
          severity: critical
          oid: "1.3.6.1.4.1.323.5.3.52.1.2.1"
          category: ' {{$labels.category}} '
          kubernetes_namespace: ' {{$labels.namespace}} '
          service: ' {{$labels.service}} '
        annotations: 
          description: '{{$labels.service}} service is not running!'
          summary: '{{$labels.service}} is not running!'

      - alert: IngressErrorRateAbove10PercentPerPod
        expr: sum by (kubernetes_pod_name)(rate(ocpm_ingress_response_total{response_code!~"2.*"}[24h]) or (up * 0 ) ) /
              sum by (kubernetes_pod_name)(rate(ocpm_ingress_response_total[24h])) * 100 >= 10
        labels:
          severity: critical
          oid: "1.3.6.1.4.1.323.5.3.52.1.2.2"
          namespace: ' {{$labels.kubernetes_namespace}} '
          podname: ' {{$labels.kubernetes_pod_name}} '
          instance: ' {{$labels.instance}} '  
        annotations:
          description: 'Ingress Error Rate above 10 Percent in {{$labels.kubernetes_pod_name}} in {{$labels.kubernetes_namespace}}'
          summary: 'Transaction Error Rate in {{$labels.kubernetes_pod_name}} (current value is: {{ $value }})'
      
      - alert: SMTrafficRateAboveThreshold
        expr:  sum(rate(ocpm_ingress_request_total{servicename_3gpp="npcf-smpolicycontrol"}[2m])) >= 900
        labels:
          severity: major
          oid: "1.3.6.1.4.1.323.5.3.52.1.2.3"
        annotations:
          description: 'SM service Ingress traffic Rate is above threshold of Max MPS (current value is: {{ $value }})'
          summary: 'Traffic Rate is above 90 Percent of Max requests per second'
      
      - alert: SMIngressErrorRateAbove10Percent
        expr: (sum(rate(ocpm_ingress_response_total{servicename_3gpp="npcf-smpolicycontrol",response_code!~"2.*"}[24h]) or (up * 0 ) ) /
              sum(rate(ocpm_ingress_response_total{servicename_3gpp="npcf-smpolicycontrol"}[24h]))) * 100 >= 10
        labels:
          severity: critical
          oid: "1.3.6.1.4.1.323.5.3.52.1.2.4"   
        annotations:
          description: 'Transaction Error Rate detected above 10 Percent of Total on SM service (current value is: {{ $value }})'
          summary: 'Transaction Error Rate detected above 10 Percent of Total Transactions'      
      
      - alert: SMEgressErrorRateAbove1Percent
        expr: (sum(rate(ocpm_egress_response_total{servicename_3gpp="npcf-smpolicycontrol",response_code!~"2.*"}[24h]) or (up * 0 ) ) /
              sum(rate(ocpm_egress_response_total{servicename_3gpp="npcf-smpolicycontrol"}[24h]))) * 100 >= 1
        labels:
          severity: minor
          oid: "1.3.6.1.4.1.323.5.3.52.1.2.5"
        annotations:
          description: 'Egress Transaction Error Rate detected above 1 Percent of Total Transactions (current value is: {{ $value }})'
          summary: 'Transaction Error Rate detected above 1 Percent of Total Transactions'
      
      - alert: DiamTrafficRateAboveThreshold
        expr:  sum(rate(ocpm_ingress_request_total{servicename_3gpp=~"rx|sy"}[2m])) >= 900
        labels:
          severity: major
          oid: "1.3.6.1.4.1.323.5.3.52.1.2.6"
        annotations:
          description: 'Diam connector Ingress traffic Rate is above threshold of Max MPS (current value is: {{ $value }})'
          summary: 'Traffic Rate is above 90 Percent of Max requests per second'
      
      - alert: DiamIngressErrorRateAbove10Percent
        expr: (sum(rate(ocpm_ingress_response_total{servicename_3gpp=~"rx|sy",response_code!~"2.*"}[24h]) or (up * 0 ) ) /
              sum(rate(ocpm_ingress_response_total{servicename_3gpp=~"rx|sy"}[24h]))) * 100 >= 10
        labels:
          severity: critical
          oid: "1.3.6.1.4.1.323.5.3.52.1.2.7"
        annotations:
          description: 'Transaction Error Rate detected above 10 Percent of Total on Diameter Connector (current value is: {{ $value }})'
          summary: 'Transaction Error Rate detected above 10 Percent of Total Transactions'
      
      - alert: DiamEgressErrorRateAbove1Percent
        expr: (sum(rate(ocpm_egress_response_total{servicename_3gpp=~"rx|sy",response_code!~"2.*"}[24h]) or (up * 0 ) ) /
              sum(rate(ocpm_egress_response_total{servicename_3gpp=~"rx|sy"}[24h]))) * 100 >= 1
        labels:
          severity: minor
          oid: "1.3.6.1.4.1.323.5.3.52.1.2.8"
        annotations:
          description: 'Egress Transaction Error Rate detected above 1 Percent of Total on Diameter Connector (current value is: {{ $value }})'
          summary: 'Transaction Error Rate detected above 1 Percent of Total Transactions'
      
      - alert: PcfUdrIngressTrafficRateAboveThreshold
        expr: sum(rate(ocpm_userservice_inbound_count_total{service_resource="udr-service"}[2m])) >= 900
        labels:
          severity: major
          oid: "1.3.6.1.4.1.323.5.3.52.1.2.9"
        annotations:
          description: 'User service Ingress traffic Rate from UDR is above threshold of Max MPS (current value is: {{ $value }})'
          summary: 'Traffic Rate is above 90 Percent of Max requests per second'
      
      - alert: PcfUdrEgressErrorRateAbove10Percent
        expr: (sum(rate(ocpm_udr_tracking_response_total{servicename_3gpp="nudr-dr",response_code!~"2.*"}[24h]) 
              or (up * 0 ) ) /
              sum(rate(ocpm_udr_tracking_response_total{servicename_3gpp="nudr-dr"}[24h]))) * 100 >= 10
        labels:
          severity: critical
          oid: "1.3.6.1.4.1.323.5.3.52.1.2.10"
        annotations:
          description: 'Egress Transaction Error Rate detected above 10 Percent of Total on User service (current value is: {{ $value }})'
          summary: 'Transaction Error Rate detected above 10 Percent of Total Transactions'
      
      - alert: PcfChfIngressTrafficRateAboveThreshold
        expr: sum(rate(ocpm_userservice_inbound_count_total{service_resource="chf-service"}[2m])) >= 900
        labels:
          severity: major
          oid: "1.3.6.1.4.1.323.5.3.52.1.2.11"
        annotations:
          description: 'User service Ingress traffic Rate from CHF is above threshold of Max MPS (current value is: {{ $value }})'
          summary: 'Traffic Rate is above 90 Percent of Max requests per second'
      
      - alert: PcfChfEgressErrorRateAbove10Percent
        expr: (sum(rate(ocpm_chf_tracking_response_total{servicename_3gpp="nchf-spendinglimitcontrol",response_code!~"2.*"}[24h]) 
              or (up * 0 ) ) /
              sum(rate(ocpm_chf_tracking_response_total{servicename_3gpp="nchf-spendinglimitcontrol"}[24h]))) * 100 >= 10
        labels:
          severity: critical
          oid: "1.3.6.1.4.1.323.5.3.52.1.2.12"
        annotations:
          description: 'Egress Transaction Error Rate detected above 10 Percent of Total on User service (current value is: {{ $value }})'
          summary: 'Transaction Error Rate detected above 10 Percent of Total Transactions'    
      
      - alert: PolicyDsIngressTrafficRateAboveThreshold
        expr: sum(rate(client_request_total[2m])) >= 900
        labels:
          severity: critical
          oid: "1.3.6.1.4.1.323.5.3.52.1.2.13"
        annotations:
          description: 'Ingress Traffic Rate is above threshold of Max MPS (current value is: {{ $value }})'
          summary: 'Traffic Rate is above 90 Percent of Max requests per second'    
      
      - alert: PolicyDsIngressErrorRateAbove10Percent
        expr: (sum(rate(client_response_total{response!~"2.*"}[24h]) or (up * 0 ) ) /
              sum(rate(client_response_total[24h]))) * 100 >= 10
        labels:
          severity: critical
          oid: "1.3.6.1.4.1.323.5.3.52.1.2.14"
        annotations:
          description: 'Ingress Transaction Error Rate detected above 10 Percent of Totat on PolicyDS service (current value is: {{ $value }})'
          summary: 'Transaction Error Rate detected above 10 Percent of Total Transactions'
      
      - alert: PolicyDsEgressErrorRateAbove1Percent
        expr: (sum(rate(server_response_total{response!~"2.*"}[24h]) or (up * 0 ) ) /
              sum(rate(server_response_total[24h]))) * 100 >= 1
        labels:
          severity: critical
          oid: "1.3.6.1.4.1.323.5.3.52.1.2.15"    
        annotations:
          description: 'Egress Transaction Error Rate detected above 1 Percent of Total on PolicyDS service (current value is: {{ $value }})'
          summary: 'Transaction Error Rate detected above 1 Percent of Total Transactions'
      
      - alert: PcfUdrIngressTimeoutErrorAboveMajorThreshold
        expr: (sum(rate(ocpm_udr_tracking_request_timeout_total{servicename_3gpp="nudr-dr"}[24h]) or (up * 0 )) /
              sum(rate(ocpm_udr_tracking_request_total{servicename_3gpp="nudr-dr"}[24h]))) * 100 >=10
        labels:
          severity: Major
          oid: "1.3.6.1.4.1.323.5.3.52.1.2.16"    
        annotations:
          description: 'Ingress Timeout Error Rate detected above 10 Percent of Total towards UDR service (current value is: {{ $value }})'
          summary: 'Timeout Error Rate detected above 10 Percent of Total Transactions'
      
      - alert: PcfChfIngressTimeoutErrorAboveMajorThreshold
        expr: (sum(rate(ocpm_chf_tracking_request_timeout_total{servicename_3gpp="nchf-spendinglimitcontrol"}[24h]) or (up * 0 )) /
              sum(rate(ocpm_chf_tracking_request_total{servicename_3gpp="nchf-spendinglimitcontrol"}[24h]))) * 100 >=10
        labels:
          severity: Major
          oid: "1.3.6.1.4.1.323.5.3.52.1.2.17"    
        annotations:
          description: 'Ingress Timeout Error Rate detected above 10 Percent of Total towards CHF service (current value is: {{ $value }})'
          summary: 'Timeout Error Rate detected above 10 Percent of Total Transactions'
      
      - alert: DBTierDownAlert
        expr: appinfo_category_running{category="database"} != 1
        labels:
          severity: critical
          oid: "1.3.6.1.4.1.323.5.3.52.1.2.18"
          category: ' {{$labels.category}} '
        annotations:
          description: 'DB cannot be reachable!'
          summary: 'DB cannot be reachable!'
      
      - alert: CPUUsagePerServiceAboveMinorThreshold
        expr: sum(rate(cgroup_cpu_usage[2m])) >= 60
        labels:
          severity: minor
          oid: "1.3.6.1.4.1.323.5.3.52.1.2.19"
          service: ' {{$labels.service}} '
        annotations:
          description: 'CPU usage for {{$labels.service}} service is above 60'
          summary: 'CPU usage for {{$labels.service}} service is above 60'
      
      - alert: CPUUsagePerServiceAboveMajorThreshold
        expr: sum(rate(cgroup_cpu_usage[2m])) >= 80
        labels:
          severity: major
          oid: "1.3.6.1.4.1.323.5.3.52.1.2.20"
          service: ' {{$labels.service}} '
        annotations:
          description: 'CPU usage for {{$labels.service}} service is above 80'
          summary: 'CPU usage for {{$labels.service}} service is above 80'
      
      - alert: CPUUsagePerServiceAboveCriticalThreshold
        expr: sum(rate(cgroup_cpu_usage[2m])) >= 90
        labels:
          severity: critical
          oid: "1.3.6.1.4.1.323.5.3.52.1.2.21"
          service: ' {{$labels.service}} '
        annotations:
          description: 'CPU usage for {{$labels.service}} service is above 90'
          summary: 'CPU usage for {{$labels.service}} service is above 90'
      
      - alert: MemoryUsagePerServiceAboveMinorThreshold
        expr: sum(rate(cgroup_memory_usage[2m])) >= 60
        labels:
          severity: minor
          oid: "1.3.6.1.4.1.323.5.3.52.1.2.22"
          service: ' {{$labels.service}} '
        annotations:
          description: 'Memory usage for {{$labels.service}} service is above 60'
          summary: 'Memory usage for {{$labels.service}} service is above 60'
      
      - alert: MemoryUsagePerServiceAboveMajorThreshold
        expr: sum(rate(cgroup_memory_usage[2m])) >= 80
        labels:
          severity: major
          oid: "1.3.6.1.4.1.323.5.3.52.1.2.23"
          service: ' {{$labels.service}} '
        annotations:
          description: 'Memory usage for {{$labels.service}} service is above 80'
          summary: 'Memory usage for {{$labels.service}} service is above 80'
      
      - alert: MemoryUsagePerServiceAboveCriticalThreshold
        expr: sum(rate(cgroup_memory_usage[2m])) >= 90
        labels:
          severity: critical
          oid: "1.3.6.1.4.1.323.5.3.52.1.2.24"
          service: ' {{$labels.service}} '
        annotations:
          description: 'Memory usage for {{$labels.service}} service is above 90'
          summary: 'Memory usage for {{$labels.service}} service is above 90'
      
      - alert: PodDoC
        expr: occnp_pod_congestion_state == 1
        labels:
          severity: major
          oid: "1.3.6.1.4.1.323.5.3.52.1.2.25"
          service: ' {{$labels.service}} '
        annotations:
          description: 'Pod Congestion status of  {{$labels.service}} service is DoC'
          summary: 'Pod Congestion status of  {{$labels.service}} service is DoC'
      
      - alert: PodCongested
        expr: occnp_pod_congestion_state == 2
        labels:
          severity: critical
          oid: "1.3.6.1.4.1.323.5.3.52.1.2.26"
          service: ' {{$labels.service}} '
        annotations:
          description: 'Pod Congestion status of  {{$labels.service}} service is congested'
          summary: 'Pod Congestion status of  {{$labels.service}} service is congested'
      
      - alert: PodPendingRequestDoC
        expr: occnp_pod_resource_congestion_state{type="queue"} == 1
        labels:
          severity: major
          oid: "1.3.6.1.4.1.323.5.3.52.1.2.27"
          service: ' {{$labels.service}} '
        annotations:
          description: 'Pod Resource Congestion status of {{$labels.service}} service is DoC for PendingRequest type'
          summary: 'Pod Resource Congestion status of {{$labels.service}} service is DoC for PendingRequest type'
      
      - alert: PodPendingRequestCongested
        expr: occnp_pod_resource_congestion_state{type="queue"} == 2
        labels:
          severity: critical
          oid: "1.3.6.1.4.1.323.5.3.52.1.2.28"
          service: ' {{$labels.service}} '
        annotations:
          description: 'Pod Resource Congestion status of  {{$labels.service}} service is congested for PendingRequest type'
          summary: 'Pod Resource Congestion status of  {{$labels.service}} service is congested for PendingRequest type'
      
      - alert: PodCPUDoC
        expr: occnp_pod_resource_congestion_state{type="cpu"} == 1
        labels:
          severity: major
          oid: "1.3.6.1.4.1.323.5.3.52.1.2.29"
          service: ' {{$labels.service}} '
        annotations:
          description: 'Pod Resource Congestion status of {{$labels.service}} service is DoC for CPU type'
          summary: 'Pod Resource Congestion status of {{$labels.service}} service is DoC for CPU type'
      
      - alert: PodCPUCongested
        expr: occnp_pod_resource_congestion_state{type="cpu"} == 2
        labels:
          severity: critical
          oid: "1.3.6.1.4.1.323.5.3.52.1.2.30"
          service: ' {{$labels.service}} '
        annotations:
          description: 'Pod Resource Congestion status of  {{$labels.service}} service is congested for CPU type'
          summary: 'Pod Resource Congestion status of  {{$labels.service}} service is congested for CPU type'
      
      - alert: PodMemoryDoC
        expr: occnp_pod_resource_congestion_state{type="memory"} == 1
        labels:
          severity: major
          oid: "1.3.6.1.4.1.323.5.3.52.1.2.31"
          service: ' {{$labels.service}} '
        annotations:
          description: 'Pod Resource Congestion status of {{$labels.service}} service is DoC for Memory type'
          summary: 'Pod Resource Congestion status of {{$labels.service}} service is DoC for Memory type'
      
      - alert: PodMemoryCongested
        expr: occnp_pod_resource_congestion_state{type="memory"} == 2
        labels:
          severity: critical
          oid: "1.3.6.1.4.1.323.5.3.52.1.2.32"
          service: ' {{$labels.service}} '
        annotations:
          description: 'Pod Resource Congestion status of  {{$labels.service}} service is congested for Memory type'
          summary: 'Pod Resource Congestion status of  {{$labels.service}} service is congested for Memory type'
      
      - alert: SCP_PEER_UNAVAILABLE
        annotations:
          description: "Configured SCP peer is unavailable."
          summary: "SCP peer [ {{$labels.peer}} ] is unavailable."
        expr: occnp_oc_egressgateway_peer_health_status != 0
        labels:
          namespace: ' {{$labels.namespace}} '
          timestamp: ' {{ with query "time()" }}{{ . | first | value | humanizeTimestamp }}{{ end }} '
          oid: 1.3.6.1.4.1.323.5.3.52.1.2.60
          severity: major

      - alert: SCP_PEER_SET_UNAVAILABLE
        annotations:
          description: "None of the SCP peer available for configured peerset."
          summary: "{{ $value }} SCP peers under peer set {{$labels.peerset}} are currently available."
        expr: (occnp_oc_egressgateway_peer_count - occnp_oc_egressgateway_peer_available_count) !=0 and (occnp_oc_egressgateway_peer_count) > 0
        labels:
          namespace: ' {{$labels.namespace}} '
          timestamp: ' {{ with query "time()" }}{{ . | first | value | humanizeTimestamp }}{{ end }} '
          oid: 1.3.6.1.4.1.323.5.3.52.1.2.61
          severity: critical
    
      - alert: SMSC_CONNECTION_DOWN
        expr: sum by(namespace, pod, smscName)(occnp_active_smsc_conn_count) == 0
        for: 10m
        labels:
          severity: major
          oid: 1.3.6.1.4.1.323.5.3.52.1.2.63
          namespace: '{{$labels.namespace}}'
        annotations:
          description: 'Connection to SMSC peer {{$labels.smscName}} is down in notifier service pod {{$labels.pod}}'
          summary: 'Connection to SMSC down'
